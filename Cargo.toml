[workspace]
resolver = "3"
members = ["crates/tsukumoe-core", "crates/tsukumoe-format", "crates/tsukumoe-gpu", "crates/tsukumoe-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/narusenia/tsukumoe"

[workspace.dependencies]
tsukumoe-core = { path = "crates/tsukumoe-core", version = "0.1.0" }
tsukumoe-format = { path = "crates/tsukumoe-format", version = "0.1.0" }
tsukumoe-gpu = { path = "crates/tsukumoe-gpu", version = "0.1.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
wgpu = "29"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
png = "0.18"
jsonschema = { version = "0.33", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

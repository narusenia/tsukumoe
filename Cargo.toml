[workspace]
resolver = "3"
members = ["crates/tsukumoe-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/narusenia/tsukumoe"

[workspace.dependencies]
tsukumoe-core = { path = "crates/tsukumoe-core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

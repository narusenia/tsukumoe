[workspace]
resolver = "3"
members = ["crates/tsukumoe-core", "crates/tsukumoe-runtime", "crates/tsukumoe-ffi", "crates/tsukumoe-format", "crates/tsukumoe-gpu", "crates/tsukumoe-cli", "crates/tsukumoe-ui", "crates/tsukumoe-host", "crates/tsukumoe-i18n", "crates/tsukumoe-wasm", "crates/tsukumoe-tracking", "crates/tsukumoe-ai"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/narusenia/tsukumoe"

[workspace.dependencies]
tsukumoe-core = { path = "crates/tsukumoe-core", version = "0.1.0" }
tsukumoe-runtime = { path = "crates/tsukumoe-runtime", version = "0.1.0" }
tsukumoe-ffi = { path = "crates/tsukumoe-ffi", version = "0.1.0" }
tsukumoe-format = { path = "crates/tsukumoe-format", version = "0.1.0" }
tsukumoe-gpu = { path = "crates/tsukumoe-gpu", version = "0.1.0" }
tsukumoe-i18n = { path = "crates/tsukumoe-i18n", version = "0.1.0" }
tsukumoe-ui = { path = "crates/tsukumoe-ui", version = "0.1.0" }
tsukumoe-wasm = { path = "crates/tsukumoe-wasm", version = "0.1.0" }
tsukumoe-host = { path = "crates/tsukumoe-host", version = "0.1.0" }
tsukumoe-tracking = { path = "crates/tsukumoe-tracking", version = "0.1.0" }
tsukumoe-ai = { path = "crates/tsukumoe-ai", version = "0.1.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", default-features = false }
schemars = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
png = "0.18"
criterion = { version = "0.7", default-features = false }
egui = "0.37"
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
egui_kittest = { version = "0.37", features = ["snapshot", "wgpu"] }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
cbindgen = { version = "0.29", default-features = false }
cc = "1"
jsonschema = { version = "0.33", default-features = false }
syphon-wgpu = "0.4.3"
syphon-core = "0.4.0"
spout-rs = "0.1.3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# `cargo build --profile wasm`: the npm package's size-first build (the
# distributed wasm must stay under 1 MB gzipped, see docs/implementation/M3-runtime/wasm.md).
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"

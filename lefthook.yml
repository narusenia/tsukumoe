# Installed with `mise run hooks:install`. Jobs are filtered by glob so a
# docs-only commit does not pay for clippy.
pre-commit:
  parallel: true
  jobs:
    - name: fmt
      glob: "*.rs"
      run: cargo fmt --all -- --check
    - name: clippy
      glob: "*.rs"
      run: mise run clippy
commit-msg:
  jobs:
    - name: message-format
      run: bash scripts/check-commit-msg.sh {1}

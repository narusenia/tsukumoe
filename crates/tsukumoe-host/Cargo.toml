[package]
name = "tsukumoe-host"
description = "Tsukumoe viewer and streaming host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tsukumoe-core.workspace = true
tsukumoe-format.workspace = true
tsukumoe-gpu.workspace = true
tsukumoe-tracking.workspace = true
tsukumoe-ui.workspace = true
wgpu.workspace = true
eframe.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
syphon-wgpu = { workspace = true, optional = true }
# Direct dependency only so build.rs receives DEP_SYPHON_FRAMEWORK_DIR (`links = "Syphon"`).
syphon-core = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
spout-rs = { workspace = true, optional = true }

[features]
# Publishes the output as a Syphon server (macOS; needs Syphon.framework to link and run).
syphon = ["dep:syphon-wgpu", "dep:syphon-core"]
# Publishes the output as a Spout2 sender (Windows; build needs SPOUT2_SDK_DIR and
# SPOUT2_LIB_DIR, run needs Spout.dll).
spout = ["dep:spout-rs"]

[dev-dependencies]
pollster.workspace = true

[[bin]]
name = "tsukumoe-host"
path = "src/main.rs"

[lints]
workspace = true

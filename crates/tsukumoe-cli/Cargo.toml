[package]
name = "tsukumoe-cli"
description = "Command line tool for Tsukumoe: convert, validate, render and diff"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "tsukumoe"
path = "src/main.rs"

[lib]
name = "tsukumoe_cli"
path = "src/lib.rs"

[dependencies]
tsukumoe-ai.workspace = true
tsukumoe-core = { workspace = true, features = ["schema"] }
schemars.workspace = true
tsukumoe-format.workspace = true
tsukumoe-gpu.workspace = true
tsukumoe-psd.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
criterion.workspace = true
jsonschema.workspace = true
tsukumoe-psd = { workspace = true, features = ["test-writer"] }
tsukumoe-runtime.workspace = true
tsukumoe-tracking.workspace = true

[[bench]]
name = "reference"
harness = false

[[bench]]
name = "load"
harness = false

[[bench]]
name = "gpu"
harness = false

[lints]
workspace = true

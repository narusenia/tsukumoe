language = "C"
include_guard = "TSUKUMOE_H"
cpp_compat = true
line_endings = "LF"
usize_is_size_t = true
header = """
/*
 * Tsukumoe C ABI. Generated by cbindgen from tsukumoe-ffi; do not edit.
 * Regenerate: TSUKUMOE_UPDATE_HEADER=1 cargo test -p tsukumoe-ffi --test header
 * Rules: docs/specifications/c-abi.md
 */"""
documentation_style = "c99"

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[export]
include = ["TsukumoeStatus", "TsukumoePriority", "TsukumoeBlendMode"]

[parse]
parse_deps = false

name: CI

# Documentation-only changes skip CI.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_INCREMENTAL: "0"
  TSUKUMOE_REQUIRE_GPU: "1"

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # blaze is a developer tool; CI needs only the toolchain and jq.
      - uses: jdx/mise-action@v2
        with:
          install_args: rust jq
      - uses: Swatinem/rust-cache@v2
      # The renderer tests need a Vulkan adapter; lavapipe is a software one.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: mise run check

  bench:
    name: bench (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install_args: rust jq
      - uses: Swatinem/rust-cache@v2
      # main's medians are kept in the Actions cache; a pull request is
      # compared with the latest of them (a more than 10% slowdown fails).
      - uses: actions/cache/restore@v4
        if: github.event_name == 'pull_request'
        with:
          path: target/bench-baseline.json
          key: bench-baseline-none
          restore-keys: bench-baseline-
      - run: mise run bench
        env:
          BENCH_BASELINE: target/bench-baseline.json
          BENCH_CEILING_SCALE: "4"
      - run: cp target/bench-results.json target/bench-baseline.json
        if: github.event_name == 'push'
      - uses: actions/cache/save@v4
        if: github.event_name == 'push'
        with:
          path: target/bench-baseline.json
          key: bench-baseline-${{ github.sha }}

  web:
    name: web (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The wasm-bindgen CLI and binaryen versions are pinned in mise.toml.
      - uses: jdx/mise-action@v2
        with:
          install_args: rust jq node github:wasm-bindgen/wasm-bindgen github:WebAssembly/binaryen
      - uses: Swatinem/rust-cache@v2
      # Builds the wasm with and without SIMD, fails when one is over 1 MiB gzipped.
      - run: mise run web:build
      - run: mise run web:test

  parity:
    name: parity (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install_args: rust jq node github:wasm-bindgen/wasm-bindgen github:WebAssembly/binaryen
      - uses: Swatinem/rust-cache@v2
      # The native renderer needs a Vulkan adapter; lavapipe is a software one.
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: mise run web:build
      # Native against WASM (draw lists, in Node), then native against the golden files.
      - run: mise run web:parity
      - run: mise run parity:golden

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

# `mise run check` is the canonical verification entry point; CI and the
# lefthook pre-commit hook run the same tasks.

[tools]
rust = { version = "1.99", components = "rustfmt,clippy", targets = "wasm32-unknown-unknown", profile = "minimal" }
"github:indexable-inc/blaze" = { version = "latest", os = ["linux", "macos"] }
lefthook = "2.1.5"
jq = "1.8"
node = "22"
# wasm-bindgen-cli must match the wasm-bindgen crate version exactly.
"github:wasm-bindgen/wasm-bindgen" = "0.2.130"
"github:WebAssembly/binaryen" = "version_133"

[tasks.fmt]
description = "Check formatting"
run = "cargo fmt --all -- --check"

[tasks."fmt:fix"]
description = "Apply formatting"
run = "cargo fmt --all"

[tasks.clippy]
description = "Clippy with warnings denied"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.test]
description = "Workspace test suite"
run = "cargo test --workspace"

[tasks.wasm]
description = "Check tsukumoe-core, tsukumoe-runtime and tsukumoe-wasm build for wasm32"
run = "cargo build -p tsukumoe-core -p tsukumoe-runtime -p tsukumoe-wasm --target wasm32-unknown-unknown"

[tasks.deps]
description = "Crate dependency rules (UI-free crates, tsukumoe-core purity, tsukumoe-runtime and tsukumoe-ffi scope, unsafe only in tsukumoe-ffi)"
run = "bash scripts/check-deps.sh"

[tasks.check]
description = "Full verification (fmt + clippy + deps + wasm + test)"
depends = ["fmt", "clippy", "deps", "wasm", "test"]

[tasks."hooks:install"]
description = "Install lefthook git hooks"
run = "lefthook install"

[tasks.bench]
description = "Run the core benchmarks and compare with the ceilings in scripts/bench-budget.json"
run = ["cargo bench --workspace", "bash scripts/check-bench.sh"]

[tasks."web:build"]
description = "Build packages/tsukumoe-web (wasm with and without SIMD, glue, wasm-opt, TypeScript) and check the size budget"
run = "bash scripts/build-web.sh"

[tasks."web:test"]
description = "Type-check and test packages/tsukumoe-web (run web:build first)"
dir = "packages/tsukumoe-web"
run = ["npm run typecheck", "npm test"]

[tasks."web:parity"]
description = "Native versus WASM draw lists for every parity case (run web:build first)"
run = "bash tests/parity/native-vs-wasm.sh target/parity"

[tasks."web:parity-images"]
description = "Native versus WASM draw lists and images (starts a local server; open the printed URL in Chrome; run web:build first)"
run = "PARITY_IMAGES=1 bash tests/parity/native-vs-wasm.sh target/parity"

[tasks."parity:golden"]
description = "Native output of every parity case against tests/parity/golden (rewrite them with: bash tests/parity/golden.sh target/parity-golden --update)"
run = "bash tests/parity/golden.sh target/parity-golden"
